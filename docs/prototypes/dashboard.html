  <script>
    'use strict';
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const icon = (name, size = 18, extra = '') => `<svg ${extra} width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const states = {
      running: {label:'执行中', icon:'play', tone:'#8cceb0', tint:'#253e30', detail:'任务正在向前推进', description:'已持续收到执行事件，当前正在校验资源引用与构建结果。无需发送续接请求。', reason:'运行正常', action:'任务执行中', foot:'持续观察执行事件，保持当前任务流程。', micro:'持续收到执行事件', note:'正常运行'},
      retry: {label:'内部重试', icon:'retry', tone:'#d5ba7c', tint:'#3d3728', detail:'让内部重试先完成', description:'Codex 正在自行重试一次工具调用。面板只观察结果，避免重复发送继续指令。', reason:'工具调用暂时失败', action:'等待内部重试', foot:'由 Codex 自行处理，面板不会叠加续接。', micro:'内部恢复流程进行中', note:'由 Codex 处理'},
      network: {label:'网络失败待重试', icon:'network', tone:'#e3a28c', tint:'#45322b', detail:'连接中断，等待续接', description:'模拟连接在接收执行结果时中断。将在等待期结束后发送续接，并确认是否收到新的执行事件。', reason:'连接意外关闭 · ECONNRESET', action:'立即继续', foot:'本地模拟：发送后约 2.4 秒收到恢复确认。', micro:'连接中断，已进入等待', note:'可自动恢复'},
      quota: {label:'额度等待', icon:'clock', tone:'#dbb77e', tint:'#403725', detail:'留一点时间，等待额度', description:'模拟服务返回额度限制。等待示例重置时间后再尝试，避免短时间反复发送。', reason:'达到使用限制 · RATE_LIMIT', action:'立即继续', foot:'本地模拟：人工续接同样演示恢复确认流程。', micro:'等待示例额度重置', note:'到时再尝试'},
      approval: {label:'等待用户批准', icon:'lock', tone:'#a9c5d0', tint:'#2d3e43', detail:'下一步，由你来决定', description:'此会话需要用户批准一项操作。自动继续不会替代审批，请在真实 Codex 中查看操作内容。', reason:'一项操作需要用户批准', action:'需在 Codex 中人工批准', foot:'预览未连接 Codex，不会提交或代替任何批准。', micro:'等待人工审批', note:'仅人工处理'},
      complete: {label:'已完成', icon:'check', tone:'#aec998', tint:'#303d29', detail:'这一程，已经完成', description:'任务已正常结束，最后一次执行结果已返回。面板保留记录，方便查看处理过程。', reason:'正常完成', action:'任务已完成', foot:'正常完成不会触发自动继续。', micro:'执行结果已返回', note:'无需继续'},
      stopped: {label:'用户已停止', icon:'stop', tone:'#b1bfaa', tint:'#323c2d', detail:'尊重这一次暂停', description:'模拟用户主动停止任务。面板不会自动发送继续，也不会将主动停止判断为异常。', reason:'用户主动停止', action:'用户已停止任务', foot:'请在真实 Codex 中手动发起新的执行。', micro:'用户主动结束执行', note:'禁止自动续接'},
      resuming: {label:'等待恢复确认', icon:'clock', tone:'#b8cf8e', tint:'#36442b', detail:'已发送，等待恢复确认', description:'模拟续接请求已经发送。只有收到新的执行事件，才会确认恢复并显示运行中的状态。', reason:'续接已发送，尚未确认', action:'已发送，等待恢复确认', foot:'本地模拟：约 2.4 秒后产生新的执行事件。', micro:'续接请求已发送', note:'尚未恢复运行'}
    };
    let demoSeconds = 0;
    let globalMonitoring = true;
    let activeFilter = 'all';
    let selectedId = 's3';
    let toastTimer;
    const notificationPlatforms = {dingtalk:'钉钉',feishu:'飞书',wecom:'企业微信',generic:'通用 Webhook'};
    const notificationEvents = {exception:'会话异常',recovered:'确认恢复',exhausted:'重试耗尽'};
    let notificationSettings = {platform:'dingtalk',name:'',webhook:'',secret:'',enabled:false,events:{exception:true,recovered:true,exhausted:true}};
    let notificationSaved = false;
    let notificationDraft = null;
    let notificationLastTest = null;
    let notificationLastEvent = null;
    let notificationTestVersion = 0;
    let currentModalType = '';
    const replyModes = {zh:{label:'中文',message:'继续'},en:{label:'英文',message:'continue'},custom:{label:'自定义',message:''}};
    let replySettings = {mode:'zh',custom:''};
    const continuationMessage = () => replySettings.mode === 'custom' ? replySettings.custom : replyModes[replySettings.mode].message;
    const sessions = [
      {id:'s1', name:'整理读书笔记目录', project:'个人知识库', step:'校验目录与链接', state:'running', monitor:true, retries:0, remaining:0, events:[['35:56','收到新的执行事件'],['35:42','开始检查目录结构'],['34:12','任务开始执行']]},
      {id:'s2', name:'制作天气卡片组件', project:'示例组件', step:'重新调用构建工具', state:'retry', monitor:true, retries:1, remaining:0, events:[['35:51','进入工具内部重试'],['35:49','工具调用暂时失败'],['34:31','开始构建卡片组件']]},
      {id:'s3', name:'完善旅行清单页面', project:'旅行小工具', step:'检查页面交互', state:'network', monitor:true, retries:2, remaining:30, events:[['35:58','连接中断，进入 30 秒等待'],['35:57','接收结果时连接意外关闭'],['35:12','第 2 次续接后恢复执行'],['33:46','开始检查页面交互']]},
      {id:'s4', name:'生成每周阅读摘要', project:'阅读助手', step:'等待示例额度重置', state:'quota', monitor:true, retries:0, remaining:300, events:[['35:47','已设置示例额度等待时间'],['35:46','服务返回使用额度限制'],['32:10','开始整理阅读摘要']]},
      {id:'s5', name:'归档示例图片素材', project:'素材整理', step:'等待操作批准', state:'approval', monitor:true, retries:0, remaining:0, events:[['35:38','需要人工批准文件操作'],['35:37','面板保持观察，不发送继续'],['31:25','开始分析示例图片']]},
      {id:'s6', name:'优化番茄钟配色', project:'专注小工具', step:'已完成视觉调整', state:'complete', monitor:false, retries:0, remaining:0, events:[['34:52','任务正常完成'],['34:41','视觉检查通过'],['30:21','开始调整主题颜色']]}
    ];
    const selected = () => sessions.find(session => session.id === selectedId);
    const isActive = session => ['running','retry','resuming'].includes(session.state);
    const needsAttention = session => ['network','quota','approval','stopped'].includes(session.state);
    const isRecoverable = session => ['network','quota'].includes(session.state);
    const stateStyle = state => `--tone:${states[state].tone};--tint:${states[state].tint}`;
    const formatTime = seconds => `${Math.floor(seconds / 60).toString().padStart(2,'0')}:${(seconds % 60).toString().padStart(2,'0')}`;
    const currentTime = () => { const elapsed = 36 * 60 + demoSeconds; return `14:${formatTime(elapsed)}`; };
    const nextLabel = session => {
      if (session.state === 'resuming') return '等待新执行事件';
      if (session.state === 'retry') return '由 Codex 内部决定';
      if (!isRecoverable(session)) return '不触发自动续接';
      if (session.retries >= 5) return '已达上限，等待人工处理';
      if (!session.monitor) return '单会话监控已关闭';
      if (!globalMonitoring) return '全局暂停，倒计时已冻结';
      return `${formatTime(session.remaining)} 后 · 模拟倒计时`;
    };

    // Each status has its own silhouette, so recognition does not depend on color.
    function illustration(state, small = false) {
      const art = {
        running:'<path d="M26 85h28l20-28h46" stroke="#91b59e" stroke-width="3" stroke-dasharray="3 5" fill="none"/><rect x="21" y="74" width="22" height="22" rx="6" fill="#c0dbc3"/><circle cx="76" cy="57" r="17" fill="#e5efe1" stroke="#90b39a" stroke-width="1.5"/><path d="m70 49 15 8-15 8z" fill="#2c7a5c"/><path d="m104 34 35 23-35 23 7-23z" fill="#559b78"/><path d="m111 57 28 0-35 23z" fill="#337958"/><path d="m104 34 7 23 28 0" fill="#a6cfad"/><circle cx="43" cy="37" r="3" fill="#9cbd89"/><path d="M126 89v8m-4-4h8" stroke="#aac293" stroke-width="2"/>',
        retry:'<circle cx="80" cy="63" r="31" fill="#f7e9c9"/><path d="M46 56a36 36 0 0 1 65-17" stroke="#b9924d" stroke-width="3" fill="none"/><path d="m113 28 1 15-15-2" stroke="#b9924d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M114 70a36 36 0 0 1-65 18" stroke="#d9bf80" stroke-width="3" fill="none"/><path d="m47 99-1-15 15 2" stroke="#d9bf80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="66" y="49" width="28" height="28" rx="9" fill="#fff9e9" stroke="#b99557" stroke-width="1.5"/><circle cx="74" cy="63" r="2" fill="#a17733"/><circle cx="86" cy="63" r="2" fill="#a17733"/><path d="M24 76h9m93-28h10" stroke="#d6c294" stroke-width="2"/>',
        network:'<path d="M20 92h122" stroke="#e0c5b7" stroke-width="1.5"/><path d="m30 75 26-14 26 14-26 14z" fill="#d79c85"/><path d="m30 75 26 14v17L30 92z" fill="#c78b74"/><path d="m56 89 26-14v17l-26 14z" fill="#e8b69c"/><path d="m96 49 26-14 26 14-26 14z" fill="#f1c8b4"/><path d="m96 49 26 14v17L96 66z" fill="#d89378"/><path d="m122 63 26-14v17l-26 14z" fill="#e6b29a"/><path d="m69 66 9-7m9-8 9-7" stroke="#b8573d" stroke-width="2" stroke-dasharray="3 4"/><path d="m81 35-6 12 10-1-6 13" stroke="#a94b35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="37" cy="41" r="3" fill="#dcac94"/><path d="m127 93 4 4m-4 0 4-4" stroke="#c58b75" stroke-width="1.5"/>',
        quota:'<ellipse cx="80" cy="101" rx="29" ry="5" fill="#e6d7ad"/><path d="M60 26h40M60 94h40" stroke="#a88543" stroke-width="5" stroke-linecap="round"/><path d="M64 29c0 20 2 22 16 32-14 10-16 12-16 30h32c0-18-2-20-16-30 14-10 16-12 16-32z" fill="#fcf8e8" stroke="#b59a62" stroke-width="1.7"/><path d="m69 42 22 0c-2 7-7 12-11 15-4-3-9-8-11-15M70 87c1-6 5-10 10-13 5 3 9 7 10 13z" fill="#d9b367"/><path d="M80 63v5" stroke="#bc9449" stroke-width="2" stroke-dasharray="1 2"/><circle cx="117" cy="49" r="14" fill="#f7edcf" stroke="#c5aa70" stroke-width="1.5"/><path d="M117 41v9l5 3" stroke="#a17c38" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M35 66h11m-5-5v10" stroke="#d1bc83" stroke-width="2"/>',
        approval:'<path d="M48 32h51l14 14v52H48z" fill="#d8e4e8" stroke="#9fb4bc" stroke-width="1.4"/><path d="M99 32v14h14" fill="#edf4f3" stroke="#9fb4bc" stroke-width="1.4"/><path d="M60 47h22M60 57h37M60 67h22" stroke="#9cb2b9" stroke-width="2" stroke-linecap="round"/><path d="M99 64c9 7 17 6 17 6v13c0 12-17 19-17 19S82 95 82 83V70s8 1 17-6z" fill="#7396a4"/><rect x="92" y="79" width="14" height="11" rx="3" fill="#edf4ed"/><path d="M95 79v-4a4 4 0 0 1 8 0v4" stroke="#edf4ed" stroke-width="2" fill="none"/><path d="M32 71h9m-5-5v10" stroke="#aac1c5" stroke-width="2"/><circle cx="122" cy="37" r="3" fill="#c7d6d7"/>',
        complete:'<path d="M47 34h49l17 17v46H47z" fill="#dbe6d0" stroke="#b4c5a5" stroke-width="1.5"/><path d="M96 34v17h17" fill="#f0f6e9" stroke="#b4c5a5" stroke-width="1.5"/><path d="M59 51h21M59 61h30M59 71h20" stroke="#b1c49f" stroke-width="2" stroke-linecap="round"/><circle cx="101" cy="84" r="21" fill="#7e9e69"/><path d="m91 84 7 7 14-15" stroke="#f7fbf1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="m123 33 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#c0d19f"/><path d="M31 65v9m-4-4h8" stroke="#c0d19f" stroke-width="2"/>',
        stopped:'<circle cx="80" cy="62" r="36" fill="#e2e8db" stroke="#aebba1" stroke-width="1.5"/><rect x="65" y="47" width="30" height="30" rx="6" fill="#8d9c7f"/><path d="M37 101h86" stroke="#d2dcca" stroke-width="2"/><circle cx="126" cy="37" r="3" fill="#c1cdb6"/><path d="M27 50h9m-4-4v8" stroke="#b8c8ab" stroke-width="2"/>',
        resuming:'<path d="m39 57 75-28-22 65-18-25z" fill="#b7cda0" stroke="#8ba36e" stroke-width="1.2"/><path d="m74 69 40-40-23 65z" fill="#91b273"/><path d="m39 57 35 12 40-40z" fill="#d7e5c5"/><path d="m33 78-11 8m22 2-11 8" stroke="#b7cba1" stroke-width="2" stroke-linecap="round"/><circle cx="112" cy="86" r="18" fill="#f5f8eb" stroke="#8ea575" stroke-width="1.5"/><path d="M112 76v10l6 4" stroke="#77915b" stroke-width="2" stroke-linecap="round" fill="none"/><circle class="pending-mark" cx="132" cy="43" r="3" fill="#88a768"/>'
      };
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="${states[state].label}状态插画"><path d="M23 105h115M35 22v7m-3-4h6" stroke="#b1c1a5" stroke-opacity=".25" stroke-width="1"/>${art[state]}</svg>`;
    }

    function preserveFocus(render) {
      const id = document.activeElement && document.activeElement.id;
      render();
      if (id) document.getElementById(id)?.focus({preventScroll:true});
    }
    function renderList() {
      const query = $('#search').value.trim().toLowerCase();
      const list = sessions.filter(session => (activeFilter === 'all' || (activeFilter === 'running' ? isActive(session) : needsAttention(session))) && `${session.name} ${session.project} ${states[session.state].label}`.toLowerCase().includes(query));
      $('#list-result').textContent = `会话 / ${list.length}${query ? ' 个匹配结果' : ''}`;
      $('#clear-search').classList.toggle('hidden', !query);
      $('#session-list').innerHTML = list.length ? list.map((session, index) => {
        const state = states[session.state];
        return `<article class="session-card ${session.id === selectedId ? 'selected' : ''}" style="${stateStyle(session.state)};--delay:${Math.min(index * .045,.2)}s"><button class="session-select" id="select-${session.id}" data-select="${session.id}" aria-pressed="${session.id === selectedId}" aria-label="查看${session.name}，${state.label}"><span class="mini-art">${illustration(session.state,true)}</span><span><span class="session-title" style="display:block">${escapeHtml(session.name)}</span><span class="session-subtitle"><span>${escapeHtml(session.project)}</span><span>${escapeHtml(session.step)}</span></span></span><span class="state-column"><span class="status-pill">${icon(state.icon,11)}${state.label}</span><span class="row-detail" style="display:block" data-row-timer="${session.id}">${rowLabel(session)}</span></span></button><button class="monitor-switch" id="monitor-${session.id}" role="switch" aria-checked="${session.monitor}" aria-label="监控${session.name}" data-monitor="${session.id}" title="${session.monitor ? '关闭' : '启用'}此会话监控"></button></article>`;
      }).join('') : '<div class="empty-state"><strong>这里暂时没有会话</strong>试试其他筛选，或换一个搜索词。</div>';
    }
    function rowLabel(session) {
      if (isRecoverable(session) && session.retries >= 5) return '已达重试上限';
      if (isRecoverable(session) && globalMonitoring && session.monitor) return `${formatTime(session.remaining)} 后重试`;
      if (isRecoverable(session)) return '自动续接已暂停';
      return states[session.state].note;
    }
    function renderInspector() {
      const session = selected();
      const state = states[session.state];
      const pending = session.state === 'resuming';
      const timeline = session.events.slice(0,4).map(event => `<li><time>${event[0]}</time><p>${escapeHtml(event[1])}</p></li>`).join('');
      $('#inspector').style.cssText = stateStyle(session.state);
      $('#inspector').innerHTML = `<div class="inspector-head"><span>会话检查</span><span class="detail-id">DEMO / ${session.id.slice(1).padStart(2,'0')}</span></div><div class="inspector-content"><div class="inspector-main"><div class="state-hero">${illustration(session.state)}<span class="hero-caption">${pending ? 'WAITING FOR CONFIRMATION' : 'EVERY STATE TELLS A STORY'}</span></div><div class="detail-state"><span class="status-pill">${icon(state.icon,12)}${state.label}</span><small>${state.note}</small></div><h2>${escapeHtml(session.name)}</h2><p class="detail-description">${state.description}</p><dl class="detail-facts"><div class="fact-row"><dt>当前原因</dt><dd class="reason-value">${state.reason}</dd></div><div class="fact-row"><dt>续接次数</dt><dd>${session.retries} / 5 次${session.state === 'retry' ? ' · 内部重试另计' : ''}</dd></div><div class="fact-row"><dt>下次续接</dt><dd id="next-retry">${nextLabel(session)}</dd></div></dl><button class="primary-action ${pending ? 'pending' : ''}" id="continue-session" ${!isRecoverable(session) ? 'disabled' : ''}>${icon(pending ? 'clock' : isRecoverable(session) ? 'arrow' : state.icon,16)}${state.action}</button><p class="action-note">${state.foot}</p></div><div class="inspector-secondary"><div class="timeline-head"><h3>最近事件</h3><span>模拟事件时间线</span></div><ol class="timeline">${timeline}</ol><button class="scenario-button" id="scenario-open">${icon('spark',14)}切换演示情景${icon('arrow',13)}</button></div></div>`;
    }
    function renderCounts() {
      const running = sessions.filter(isActive).length;
      const attention = sessions.filter(needsAttention).length;
      $('#metric-running').textContent = String(running).padStart(2,'0');
      $('#metric-attention').textContent = String(attention).padStart(2,'0');
      $('#metric-monitor').textContent = String(sessions.filter(session => session.monitor).length).padStart(2,'0');
      $('#count-all').textContent = sessions.length;
      $('#count-running').textContent = running;
      $('#count-attention').textContent = attention;
      $('#log-count').textContent = sessions.filter(isRecoverable).length;
      $$('.filter').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.filter === activeFilter)));
      $('#global-control').classList.toggle('paused',!globalMonitoring);
      $('#global-control').setAttribute('aria-pressed',String(globalMonitoring));
      $('#global-control').innerHTML = `${icon(globalMonitoring ? 'pause' : 'play',17)}<span class="control-copy">${globalMonitoring ? '暂停监控' : '恢复监控'}<small>${globalMonitoring ? 'MONITORING ON' : 'MONITORING PAUSED'}</small></span>`;
      $('#footer-state').textContent = globalMonitoring ? '模拟监控运行中' : '模拟监控已暂停';
      $('#global-dot').classList.toggle('paused',!globalMonitoring);
    }
    function renderAll() { preserveFocus(() => { renderList(); renderInspector(); renderCounts(); }); }
    function notify(message) {
      clearTimeout(toastTimer);
      $('#toast').textContent = message;
      $('#toast').classList.add('visible');
      toastTimer = setTimeout(() => $('#toast').classList.remove('visible'),3500);
    }
    function addEvent(session, message) { session.events.unshift([currentTime().slice(3),message]); session.events = session.events.slice(0,10); }

    function replySettingsMarkup() {
      return `<section class="reply-settings" aria-labelledby="reply-settings-title"><h3 id="reply-settings-title">续接消息</h3><p>选择模拟发给 Codex 的消息语言与内容。此设置控制续接消息，界面语言保持中文。</p><form class="notification-form" id="reply-form" novalidate autocomplete="off"><fieldset class="event-options"><legend>消息语言</legend><div class="reply-mode-options">${Object.entries(replyModes).map(([key,mode]) => `<label class="reply-mode-option"><input id="reply-mode-${key}" type="radio" name="reply-mode" value="${key}"><span><strong>${mode.label}</strong><small>${mode.message || '使用输入内容'}</small></span></label>`).join('')}</div></fieldset><div class="form-field hidden" id="reply-custom-group"><label for="reply-custom">自定义续接消息</label><input id="reply-custom" type="text" maxlength="1000" placeholder="请输入发给 Codex 的续接消息" aria-invalid="false" aria-describedby="reply-custom-hint reply-error"><small class="field-hint" id="reply-custom-hint">最多 1000 个字符；保存时移除首尾空白，内容不能为空。</small><span class="field-error" id="reply-error" role="alert"></span></div><p class="notification-feedback" id="reply-feedback" role="status" aria-live="polite">保存后用于人工与自动续接；修改未保存时，继续使用已生效消息。</p><div class="notification-actions"><button class="primary-action" type="submit">${icon('check',15)}保存续接消息</button></div></form><div class="notification-summary reply-summary" aria-label="已生效的续接消息"><div><strong id="reply-summary-mode">当前生效：中文</strong><p>最终消息：<span class="reply-summary-message" id="reply-summary-message">继续</span></p></div><span class="summary-state">仅本页内存</span></div><small class="field-hint">界面预览：消息只写入本地模拟事件，不发送到真实 Codex。刷新页面即清除设置，恢复默认中文“继续”。</small></section>`;
    }
    function readReplyMode() {
      return Object.keys(replyModes).find(mode => $(`#reply-mode-${mode}`).checked) || 'zh';
    }
    function updateReplySummary() {
      $('#reply-summary-mode').textContent = `当前生效：${replyModes[replySettings.mode].label}`;
      $('#reply-summary-message').textContent = continuationMessage();
    }
    function loadReplyForm() {
      Object.keys(replyModes).forEach(mode => { $(`#reply-mode-${mode}`).checked = mode === replySettings.mode; });
      $('#reply-custom').value = replySettings.custom;
      $('#reply-custom-group').classList.toggle('hidden',replySettings.mode !== 'custom');
      updateReplySummary();
      $('#reply-form').addEventListener('submit',saveReplySettings);
    }
    function replyFormChanged(event) {
      if (currentModalType !== 'policy' || !event.target.closest('#reply-form')) return;
      $('#reply-custom-group').classList.toggle('hidden',readReplyMode() !== 'custom');
      $('#reply-custom').setAttribute('aria-invalid','false');
      $('#reply-error').textContent = '';
      $('#reply-feedback').textContent = '更改尚未保存；人工与自动续接仍使用当前生效消息。';
    }
    function saveReplySettings(event) {
      event.preventDefault();
      const mode = readReplyMode();
      const custom = $('#reply-custom').value.trim();
      const error = mode === 'custom' ? (!custom ? '请输入自定义续接消息，不能只包含空白。' : custom.length > 1000 ? '自定义续接消息不能超过 1000 个字符。' : '') : '';
      $('#reply-error').textContent = error;
      $('#reply-custom').setAttribute('aria-invalid',String(Boolean(error)));
      if (error) { $('#reply-custom').focus(); return; }
      replySettings = {mode,custom};
      $('#reply-custom').value = custom;
      updateReplySummary();
      $('#reply-feedback').textContent = '续接消息已生效，保存在当前页面内存。刷新即清除；不会发送真实请求。';
    }

    // Notification configuration and test results live only in this page's memory.
    function notificationMarkup() {
      return `<div class="notification-banner">${icon('info',17)}<div><strong>界面预览：测试通知仅模拟，不会发送到真实 Webhook。</strong><small>地址与签名密钥仅保留在当前页面内存，刷新即清除。</small></div></div><section class="notification-summary" aria-label="通知设置摘要"><div><strong id="notification-summary-title">尚未配置通知</strong><p id="notification-summary-test">最近测试：尚未测试</p><p id="notification-summary-event">最近事件通知：暂无模拟记录</p></div><span class="summary-state" id="notification-summary-state">未保存</span></section><form class="notification-form" id="notification-form" novalidate autocomplete="off"><div class="form-row"><div class="form-field"><label for="notification-platform">通知平台</label><select id="notification-platform">${Object.entries(notificationPlatforms).map(([key,label]) => `<option value="${key}">${label}</option>`).join('')}</select></div><div class="form-field"><label for="notification-name">渠道名称</label><input id="notification-name" type="text" maxlength="48" placeholder="例如：工作提醒" autocomplete="off"></div></div><div class="form-field"><label for="notification-webhook">Webhook 地址</label><input id="notification-webhook" type="password" inputmode="url" placeholder="请输入 HTTPS Webhook 地址" autocomplete="new-password" spellcheck="false" aria-describedby="notification-webhook-hint notification-webhook-error" aria-invalid="false"><small class="field-hint" id="notification-webhook-hint">地址隐藏显示；保存摘要不会展示完整地址或其中的 token。</small><span class="field-error" id="notification-webhook-error" role="alert"></span></div><div class="form-field" id="notification-secret-group"><label for="notification-secret">签名密钥 <span style="color:#9aa98a">· 可选</span></label><input id="notification-secret" type="password" placeholder="未启用签名时可留空" autocomplete="new-password" spellcheck="false"><small class="field-hint">用于演示钉钉 / 飞书签名设置；预览不会计算签名或发起网络请求。</small></div><div class="setting-enabled"><div><strong>启用通知</strong><small>开启后，所选事件仅生成本地模拟通知记录。</small></div><button class="setting-switch" id="notification-enabled" type="button" role="switch" aria-checked="false" aria-label="启用通知"></button></div><fieldset class="event-options" aria-describedby="notification-events-error"><legend>通知事件</legend><div class="event-checks">${Object.entries(notificationEvents).map(([key,label]) => `<label><input type="checkbox" id="notification-event-${key}" value="${key}">${label}</label>`).join('')}</div><span class="field-error" id="notification-events-error" role="alert"></span></fieldset><p class="notification-feedback" id="notification-feedback" role="status" aria-live="polite">可先模拟测试，再保存设置。</p><div class="notification-actions"><button class="secondary-action" id="notification-test" type="button">${icon('bell',15)}测试通知（模拟）</button><button class="primary-action" id="notification-save" type="submit">${icon('check',15)}保存设置</button></div></form>`;
    }
    function updateNotificationSummary() {
      const platform = notificationPlatforms[notificationSettings.platform];
      $('#notification-status').textContent = notificationSaved ? `${platform} · ${notificationSettings.enabled ? '模拟通知已开' : '通知已关'}` : '通知未配置';
      if (currentModalType !== 'notifications' || !$('#modal').open) return;
      $('#notification-summary-title').textContent = notificationSaved ? `${platform} · ${notificationSettings.enabled ? '已开启' : '已关闭'}` : '尚未配置通知';
      $('#notification-summary-state').textContent = notificationSaved ? '仅本页内存' : '未保存';
      $('#notification-summary-test').textContent = notificationLastTest ? `最近测试：${notificationLastTest.platform} · 模拟成功 · ${notificationLastTest.time}` : '最近测试：尚未测试';
      $('#notification-summary-event').textContent = notificationLastEvent ? `最近事件通知：${notificationLastEvent.platform} · ${notificationLastEvent.event} · ${notificationLastEvent.time}（模拟）` : '最近事件通知：暂无模拟记录';
    }
    function loadNotificationForm() {
      notificationDraft = {...notificationSettings,events:{...notificationSettings.events}};
      $('#notification-platform').value = notificationDraft.platform;
      $('#notification-name').value = notificationDraft.name;
      $('#notification-webhook').value = notificationDraft.webhook;
      $('#notification-secret').value = notificationDraft.secret;
      $('#notification-enabled').setAttribute('aria-checked',String(notificationDraft.enabled));
      Object.keys(notificationEvents).forEach(key => { $(`#notification-event-${key}`).checked = notificationDraft.events[key]; });
      $('#notification-secret-group').classList.toggle('hidden',!['dingtalk','feishu'].includes(notificationDraft.platform));
      updateNotificationSummary();
    }
    function readNotificationForm() {
      return {platform:$('#notification-platform').value,name:$('#notification-name').value.trim(),webhook:$('#notification-webhook').value.trim(),secret:['dingtalk','feishu'].includes($('#notification-platform').value) ? $('#notification-secret').value.trim() : '',enabled:$('#notification-enabled').getAttribute('aria-checked') === 'true',events:Object.fromEntries(Object.keys(notificationEvents).map(key => [key,$(`#notification-event-${key}`).checked]))};
    }
    function validateNotificationForm(config) {
      let error = '';
      if (!config.webhook) error = '请输入 Webhook 地址，测试和保存都需要填写。';
      else { try { const url = new URL(config.webhook); if (url.protocol !== 'https:' || !url.hostname) error = '请输入有效的 HTTPS Webhook 地址。'; } catch { error = '地址格式不正确，请输入完整的 HTTPS 地址。'; } }
      $('#notification-webhook-error').textContent = error;
      $('#notification-webhook').setAttribute('aria-invalid',String(Boolean(error)));
      const eventsError = config.enabled && !Object.values(config.events).some(Boolean) ? '启用通知时，请至少选择一种通知事件。' : '';
      $('#notification-events-error').textContent = eventsError;
      if (error) $('#notification-webhook').focus();
      else if (eventsError) $('#notification-event-exception').focus();
      return !error && !eventsError;
    }
    function notificationFormChanged(event) {
      if (currentModalType !== 'notifications' || !event.target.closest('#notification-form')) return;
      notificationTestVersion += 1;
      if (event.target.id === 'notification-platform') {
        $('#notification-secret').value = '';
        $('#notification-secret-group').classList.toggle('hidden',!['dingtalk','feishu'].includes(event.target.value));
      }
      notificationDraft = readNotificationForm();
      $('#notification-test').disabled = false;
      $('#notification-test').removeAttribute('aria-busy');
      $('#notification-test').innerHTML = `${icon('bell',15)}测试通知（模拟）`;
      $('#notification-feedback').textContent = '更改尚未保存。配置仅保留在本页内存。';
      $('#notification-summary-state').textContent = '尚未保存更改';
      $('#notification-webhook-error').textContent = '';
      $('#notification-webhook').setAttribute('aria-invalid','false');
      $('#notification-events-error').textContent = '';
    }
    function testNotification() {
      const config = readNotificationForm();
      if (!validateNotificationForm(config)) return;
      const version = ++notificationTestVersion;
      const button = $('#notification-test');
      button.disabled = true;
      button.setAttribute('aria-busy','true');
      button.innerHTML = `${icon('clock',15)}正在模拟测试…`;
      $('#notification-feedback').textContent = '正在模拟通知投递；不会连接真实 Webhook。';
      setTimeout(() => {
        if (version !== notificationTestVersion || currentModalType !== 'notifications' || !$('#modal').open) return;
        notificationLastTest = {platform:notificationPlatforms[config.platform],time:currentTime()};
        button.disabled = false;
        button.removeAttribute('aria-busy');
        button.innerHTML = `${icon('bell',15)}再次测试（模拟）`;
        updateNotificationSummary();
        $('#notification-feedback').textContent = '模拟测试成功。未发送真实网络请求；当前输入仍需点击“保存设置”。';
      },950);
    }
    function saveNotification(event) {
      event.preventDefault();
      const config = readNotificationForm();
      if (!validateNotificationForm(config)) return;
      notificationTestVersion += 1;
      $('#notification-test').disabled = false;
      $('#notification-test').removeAttribute('aria-busy');
      $('#notification-test').innerHTML = `${icon('bell',15)}测试通知（模拟）`;
      notificationSettings = {...config,events:{...config.events}};
      notificationSaved = true;
      notificationDraft = {...config,events:{...config.events}};
      updateNotificationSummary();
      $('#notification-feedback').textContent = '已保存到当前页面内存。刷新即清除；不会发送真实通知。';
    }
    function recordNotification(kind) {
      if (!notificationSaved || !notificationSettings.enabled || !notificationSettings.events[kind]) return;
      notificationLastEvent = {platform:notificationPlatforms[notificationSettings.platform],event:notificationEvents[kind],time:currentTime()};
      updateNotificationSummary();
    }

    // Sending a request is separate from observing a new execution event.
    function continueSession(session, automatic = false) {
      if (!isRecoverable(session)) return;
      if (automatic && (!globalMonitoring || !session.monitor || session.retries >= 5)) return;
      session.retries += 1;
      session.state = 'resuming';
      session.step = '已发送，等待恢复确认';
      const generation = (session.generation || 0) + 1;
      session.generation = generation;
      addEvent(session,`${automatic ? '自动' : '人工'}发送模拟续接，消息：「${continuationMessage()}」；等待恢复确认`);
      renderAll();
      notify(`${session.name}：已发送，等待恢复确认（模拟）`);
      setTimeout(() => {
        if (session.generation !== generation || session.state !== 'resuming') return;
        session.state = 'running';
        session.step = '已恢复，继续执行剩余步骤';
        session.remaining = 0;
        addEvent(session,'收到新的执行事件，确认恢复运行（模拟）');
        recordNotification('recovered');
        renderAll();
        notify(`${session.name}：已收到模拟执行事件，确认恢复。`);
      },2400);
    }

    function openModal(type) {
      currentModalType = type;
      notificationTestVersion += 1;
      const titles = {logs:'异常记录',policy:'重试策略',about:'关于这份界面预览',scenario:'选一种情景，看看变化',notifications:'让重要状态，及时抵达'};
      $('#modal-title').textContent = titles[type];
      $('#modal-eyebrow').textContent = {logs:'EXCEPTION JOURNAL',policy:'A CAREFUL RETRY POLICY',about:'DESIGN BEFORE IMPLEMENTATION',scenario:'TRY A DIFFERENT MOMENT',notifications:'NOTIFICATION SETTINGS / PREVIEW'}[type];
      let content = '';
      if (type === 'logs') {
        const records = sessions.filter(session => isRecoverable(session) || session.state === 'resuming' || session.events.some(event => /中断|额度|模拟续接/.test(event[1])));
        content = '<p class="modal-intro">本次预览中的模拟异常及续接记录。点击一条记录，可以回到对应会话。</p>' + (records.length ? records.map(session => `<button class="log-item" data-open-session="${session.id}" style="width:100%;text-align:left;${stateStyle(session.state)}"><span class="log-icon">${icon(states[session.state].icon,17)}</span><span><h3>${escapeHtml(session.name)} · ${states[session.state].label}</h3><p>${escapeHtml(session.events[0][1])}</p><small>14:${session.events[0][0]} · 续接 ${session.retries} 次 · 点击查看会话</small></span></button>`).join('') : '<div class="empty-state"><strong>暂时没有异常</strong>可通过情景演示查看异常恢复过程。</div>');
      }
      if (type === 'policy') content = '<p class="modal-intro">以下是原型采用的示例策略，用来讨论行为与界面。所有倒计时和执行事件均为本地模拟。</p><div class="policy-grid"><section class="policy"><h3>'+icon('network',17)+'网络异常</h3><p>等待 <code>30 秒</code> 后自动续接，最多 <strong>5 次</strong>。每次只发送一个请求；收到新的执行事件才确认恢复。当前演示首次续接会模拟成功。</p></section><section class="policy"><h3>'+icon('clock',17)+'额度限制</h3><p>等待示例重置时间 <code>5 分钟</code>。正式产品需要以可验证的额度重置信息为准；此处倒计时仅用于演示。</p></section><section class="policy"><h3>'+icon('retry',17)+'内部重试</h3><p>Codex 已在重试时，面板保持观察，<strong>不会重复发送继续指令</strong>。全局或单会话监控关闭后，自动续接倒计时冻结；人工“立即继续”仍可操作。</p></section><section class="policy policy-safe"><h3>'+icon('lock',17)+'始终保留人工决定</h3><p><strong>等待用户批准、用户主动停止、正常完成</strong>均不自动续接。此原型不会批准操作、修改真实会话或连接真实服务。</p></section></div>';
      if (type === 'about') content = '<p class="modal-intro">这是为 Windows 桌面程序设计的可点击视觉原型。目标技术为 <strong>.NET Framework 4.8 + WPF</strong>，当前文件使用 HTML 演示布局与交互。</p><div class="policy-grid"><section class="policy"><h3>'+icon('grid',17)+'先看清楚，再做决定</h3><p>可测试会话筛选、搜索、监控开关、异常情景、人工续接和恢复确认。左侧异常记录与重试策略也可打开查看。</p></section><section class="policy"><h3>'+icon('flow',17)+'观察恢复，而非假定恢复</h3><p>点击“立即继续”后，界面先显示“已发送，等待恢复确认”，约 2.4 秒后模拟产生新的执行事件，才将状态切换为“执行中”。</p></section></div><div class="demo-disclaimer">界面预览 · 模拟数据<br>所有会话名称、事件、倒计时和状态均为虚构。此文件无外部网络依赖，未读取本机 Codex、文件、凭据或真实会话。它用于确认界面设计，不代表已经实现 WPF 程序或真实监控能力。</div>';
      if (type === 'scenario') content = `<p class="modal-intro">将“${escapeHtml(selected().name)}”切换为以下模拟情景。不会影响任何真实会话。</p><div class="scenario-grid">${['running','retry','network','quota','approval','complete','stopped'].map(state => `<button class="scenario-option" data-scenario="${state}" style="${stateStyle(state)}"><span class="mini-art">${illustration(state,true)}</span><span><strong>${states[state].label}</strong><small>${states[state].note}</small></span></button>`).join('')}</div><div class="demo-disclaimer">网络失败默认 30 秒后自动模拟续接；额度等待默认 5 分钟。可先暂停全局监控，再体验人工“立即继续”。</div>`;
      if (type === 'notifications') content = notificationMarkup();
      if (type === 'policy') content += replySettingsMarkup();
      $('#modal-body').innerHTML = content;
      $('#modal-close').innerHTML = icon('close',17);
      $('#modal').showModal();
      if (type === 'policy') loadReplyForm();
      if (type === 'notifications') {
        loadNotificationForm();
        $('#notification-form').addEventListener('submit',saveNotification);
      }
    }

    $('#session-list').addEventListener('click',event => {
      const toggle = event.target.closest('[data-monitor]');
      const selection = event.target.closest('[data-select]');
      if (toggle) {
        const session = sessions.find(item => item.id === toggle.dataset.monitor);
        session.monitor = !session.monitor;
        renderAll();
        notify(`${session.name}：${session.monitor ? '已开启模拟监控' : '已暂停自动续接'}。`);
      } else if (selection) { selectedId = selection.dataset.select; renderAll(); }
    });
    $('.filters').addEventListener('click',event => {
      const button = event.target.closest('[data-filter]');
      if (button) { activeFilter = button.dataset.filter; preserveFocus(() => {renderList();renderCounts();}); }
    });
    $('#search').addEventListener('input',renderList);
    $('#clear-search').addEventListener('click',() => { $('#search').value = ''; renderList(); $('#search').focus(); });
    $('#global-control').addEventListener('click',() => {
      globalMonitoring = !globalMonitoring;
      renderAll();
      notify(globalMonitoring ? '模拟监控已恢复，自动续接倒计时继续。' : '模拟监控已暂停。自动续接倒计时冻结，仍可人工继续。');
    });
    $('#inspector').addEventListener('click',event => {
      if (event.target.closest('#continue-session')) continueSession(selected());
      if (event.target.closest('#scenario-open')) openModal('scenario');
    });
    $$('.rail-button[data-modal]').forEach(button => button.addEventListener('click',() => openModal(button.dataset.modal)));
    $('#nav-sessions').addEventListener('click',() => { if ($('#modal').open) $('#modal').close(); $('#session-workspace').scrollIntoView({block:'start',behavior:'smooth'}); });
    $('#modal-close').addEventListener('click',() => $('#modal').close());
    $('#notification-status').addEventListener('click',() => openModal('notifications'));
    $('#modal').addEventListener('close',() => { notificationTestVersion += 1; currentModalType = ''; });
    $('#modal-body').addEventListener('input',notificationFormChanged);
    $('#modal-body').addEventListener('change',notificationFormChanged);
    $('#modal-body').addEventListener('input',replyFormChanged);
    $('#modal-body').addEventListener('change',replyFormChanged);
    $('#modal').addEventListener('click',event => { if (event.target === $('#modal')) { const bounds = $('#modal').getBoundingClientRect(); if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) $('#modal').close(); } });
    $('#modal-body').addEventListener('click',event => {
      if (event.target.closest('#notification-enabled')) {
        const button = $('#notification-enabled');
        button.setAttribute('aria-checked',String(button.getAttribute('aria-checked') !== 'true'));
        notificationFormChanged({target:button});
        return;
      }
      if (event.target.closest('#notification-test')) { testNotification(); return; }
      const record = event.target.closest('[data-open-session]');
      if (record) { selectedId = record.dataset.openSession; $('#modal').close(); renderAll(); return; }
      const option = event.target.closest('[data-scenario]');
      if (!option) return;
      const session = selected();
      session.generation = (session.generation || 0) + 1;
      session.state = option.dataset.scenario;
      session.exhaustedNotified = false;
      session.retries = session.state === 'network' ? 2 : 0;
      session.remaining = session.state === 'network' ? 30 : session.state === 'quota' ? 300 : 0;
      session.monitor = !['complete','stopped'].includes(session.state);
      session.step = states[session.state].micro;
      session.events = [[currentTime().slice(3),`已切换到“${states[session.state].label}”演示情景`]];
      if (isRecoverable(session)) recordNotification('exception');
      $('#modal').close();
      renderAll();
      notify(`已切换模拟情景：${states[session.state].label}。`);
    });
    document.addEventListener('keydown',event => {
      if (event.key === '/' && !$('#modal').open && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { event.preventDefault(); $('#search').focus(); }
    });

    // Update timer text in place to keep focus and list animations stable.
    setInterval(() => {
      demoSeconds += 1;
      $('#demo-clock').textContent = `演示时间 ${currentTime()}`;
      sessions.forEach(session => {
        if (isRecoverable(session) && session.retries >= 5 && !session.exhaustedNotified) { session.exhaustedNotified = true; recordNotification('exhausted'); }
        if (isRecoverable(session) && globalMonitoring && session.monitor && session.retries < 5) {
          session.remaining = Math.max(0,session.remaining - 1);
          if (session.remaining === 0) continueSession(session,true);
        }
        const timer = $(`[data-row-timer="${session.id}"]`);
        if (timer) timer.textContent = rowLabel(session);
      });
      if ($('#next-retry')) $('#next-retry').textContent = nextLabel(selected());
    },1000);
    renderAll();
  </script>
</body>
</html>
